<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real League: clasificación, noticias, calendario, jugadores y trofeos de la liga.">
    <title>Real League - Inicio</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Contenedor alto para poder hacer scroll mientras el escenario se queda fijo -->
    <div class="contenedor-scroll" id="contenedorScroll">

        <main class="escenario" id="escenario">

            <!-- CABECERA -->
            <header class="cabecera">
                <div class="logo-marca">
                    <img class="escudo-cabecera" src="img/logo.png" alt="Escudo Real League">
                    <span class="nombre-marca">REAL LEAGUE</span>
                </div>
            </header>

            <!-- TEXTO DE BIENVENIDA -->
            <div class="texto-bienvenida" id="textoBienvenida">
                <div class="subtitulo">EL FÚTBOL SE VIVE DESDE DENTRO</div>
                <h1 class="titulo-principal">WELCOME TO<br>REAL LEAGUE</h1>
            </div>

            <!-- CAMPO 3D -->
            <div class="mundo" id="mundo">
                <div class="campo">
                    <div class="lineas-campo">
                        <div class="linea-medio"></div>
                        <div class="circulo-central"></div>
                        <div class="punto-central"></div>
                        <div class="area-grande izquierda"></div>
                        <div class="area-grande derecha"></div>
                        <div class="area-pequena izquierda"></div>
                        <div class="area-pequena derecha"></div> 
                        <i class="esquina esquina-1"></i>
                        <i class="esquina esquina-2"></i>
                        <i class="esquina esquina-3"></i>
                        <i class="esquina esquina-4"></i>
                    </div>
                </div>

                <!-- LOGO: empieza tumbado en el centro y se levanta con el scroll -->
                <div class="logo-vivo" id="logoVivo">
                    <svg class="latido" viewBox="0 0 400 60" aria-hidden="true" focusable="false">
                        <path class="latido-base" d="M140 30 H112 L102 14 L90 56 L76 6 L66 30 H0 M260 30 H288 L298 14 L310 56 L324 6 L334 30 H400" />
                        <path class="latido-anim" pathLength="1" d="M140 30 H112 L102 14 L90 56 L76 6 L66 30 H0" />
                        <path class="latido-anim" pathLength="1" d="M260 30 H288 L298 14 L310 56 L324 6 L334 30 H400" />
                    </svg>
                    <img class="logo-campo" src="img/logo.jpg" alt="Logo Real League">
                </div>

                <!-- ICONOS QUE SALEN DEL CÉSPED -->
                <a class="boton-seccion btn-jugadores" href="#jugadores">
                    <img src="img/icono-jugadores.png" alt="">
                    <span>JUGADORES</span>
                </a>
                <a class="boton-seccion btn-clasificacion" href="#clasificacion">
                    <img src="img/icono-clasificacion.png" alt="">
                    <span>CLASIFICACIÓN</span>
                </a>
                <a class="boton-seccion btn-noticias" href="#noticias">
                    <img src="img/icono-noticias.png" alt="">
                    <span>NOTICIAS</span>
                </a>
                <a class="boton-seccion btn-calendario" href="#calendario">
                    <img src="img/icono-calendario.png" alt="">
                    <span>CALENDARIO</span>
                </a>
                <a class="boton-seccion btn-trofeos" href="#trofeos">
                    <img src="img/icono-trofeos.png" alt="">
                    <span>TROFEOS</span>
                </a>
            </div>

            <!-- TEXTO FINAL (aparece al terminar el scroll) -->
            <div class="texto-final" id="textoFinal">
                <strong>EL JUEGO EMPIEZA AQUÍ</strong>
                <p>ELIGE TU SECCIÓN Y DESCUBRE LA LIGA</p>
            </div>

            <div class="barra-progreso"></div>

        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
